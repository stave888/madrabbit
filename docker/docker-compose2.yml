version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: madrabbit-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root@666
      MYSQL_DATABASE: madrabbit
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ../sql/install_init.sql:/docker-entrypoint-initdb.d/install_init.sql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot@666"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - madrabbit-network

  app:
    image: pflhub/madrabbit:1.0.0
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/madrabbit?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root@666
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - madrabbit-network
    restart: unless-stopped

volumes:
  mysql_data:

networks:
  madrabbit-network:
    driver: bridge
